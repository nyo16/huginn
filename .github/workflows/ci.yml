name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Reused by release.yml so a tag is only published after the same checks pass.
  workflow_call:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      plt-key: ${{ steps.key.outputs.plt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Compute cache keys
        id: key
        env:
          LOCK_HASH: ${{ hashFiles('mix.lock') }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "value=${RUNNER_OS}-mix-${ELIXIR_VERSION}-${OTP_VERSION}-test-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "plt=${RUNNER_OS}-plt-${ELIXIR_VERSION}-${OTP_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache deps & build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.key.outputs.value }}

      - run: mix deps.get
        if: steps.cache.outputs.cache-hit != 'true'

      - run: mix compile --warnings-as-errors
        if: steps.cache.outputs.cache-hit != 'true'

  format:
    name: Formatting
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix format --check-formatted
  credo:
    name: Credo
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix credo --strict
  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix hex.audit

      # See .mix-audit-ignore for the reasoning behind each ignored advisory.
      - run: mix deps.audit --ignore-file .mix-audit-ignore

      - run: mix deps.unlock --check-unused
  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix test
  integration:
    name: Integration tests
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Start ClickHouse
        run: docker compose up -d --wait

      - run: mix test --only integration

      - name: Stop ClickHouse
        if: always()
        run: docker compose down -v
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ needs.setup.outputs.plt-key }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix dialyzer --format github
